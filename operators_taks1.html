<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=17;
        var b=12;
        document.write("<h3>Arithmetic operators:</h3>"+"<br>");
        document.write("Addition: "+(a+b)+"<br>");
        document.write("Subtraction:"+(a-b)+"<br>");
        document.write("Multiplication: "+(a*b)+"<br>");
        document.write("Division:"+(a/b)+"<br>");
        document.write("Remainder:"+(a%b)+"<br>");
        document.write("power:"+(a**b)+"<br>");

        document.write("<h3>Relational operators:</h3>"+"<br>");
        document.write("a==b:"+(a==b)+"<br>");
        document.write("a===b:"+(a===b)+"<br>");
        document.write("a!=b:"+(a!=b)+"<br>");
        document.write("a>b:"+(a>b)+"<br>");
        document.write("a>=b:"+(a>=b)+"<br>");
        document.write("a<b:"+(a<b)+"<br>");
        document.write("a<=b:"+(a<=b)+"<br>");

        document.write("<h3>Logical operators:</h3>"+"<br>");
        document.write("Logical AND(&&):"+(a>b && a>2)+"<br>");
          document.write("Logical AND(&&):"+(a>b && b>a)+"<br>");
        document.write("Logical OR(||):"+(a>b || b>a)+"<br>");
        document.write("Logical OR(||):"+(a<b|| a>1)+"<br>");
        document.write("Logical NOT(!):"+ !(a>b)+"<br>");

        document.write("<h3>Assignment operators:</h3>"+"<br>");
        var x=20;
        document.write("x=10:"+x+"<br>");
        x+=5;
        document.write("x+=5"+x+"<br>");
        x-=3;
        document.write("x-=3:"+"<br>");
        x*=2;
        document.write("x*=4:"+"<br>");
        x%=3;
        document.write("x%=3:"+x+"<br>");

        document.write("<h3>Bitwise Operators:</h3>"+"<br>")
        document.write("a&b:"+(a&b)+"<br>");
        document.write("a|b:"+(a|b)+"<br>");
        document.write("a^b:"+(a^b)+"<br>");
        document.write("~a:"+(~a)+"<br>");
        document.write("a<<1:"+(a<<1)+"<br>");
         document.write("a<<2:"+(a<<2)+"<br>");
        document.write("a>>1:"+(a>>1)+"<br>");
         document.write("a>>2:"+(a>>2)+"<br>");
    </script>
</body>
</html>
