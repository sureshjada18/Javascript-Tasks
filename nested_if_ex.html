<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested If and Even Odd</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#e8f1f8;
            color:#1f2937;
        }
        .container{
            width:700px;
            margin:60px auto;
        }
        h1{
            text-align:center;
            background:#12355b;
            color:white;
            padding:20px;
            border-radius:12px;
        }
        .card{
            background:white;
            padding:25px;
            margin-top:20px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }
        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#12355b;
        }
        input{
            width:100%;
            padding:12px;
            border:2px solid #82c0cc;
            border-radius:6px;
            font-size:16px;
        }
        button{
            margin-top:15px;
            padding:12px 25px;
            border:none;
            border-radius:6px;
            background:#0077b6;
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#023e8a;
        }
        #result{
            margin-top:20px;
            padding:15px;
            background:#f1f8ff;
            border-left:5px solid #0077b6;
            border-radius:6px;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nested If & Even Odd Check</h1>
        <div class="card">
            <label for="number">Enter a Number</label>
            <input type="number" id="number" placeholder="Enter a number">
            <button onclick="checkNumber()">Check Number</button>
            <div id="result"></div>
        </div>
    </div>
    <script src="nested_if_ex.js"></script>
</body>
</html>
